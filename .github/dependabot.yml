version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-rust-dependencies:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
