name: cargo-deny
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check application dependencies
        run: cargo deny --locked check
      - name: Check vendored xattr dependencies
        run: cargo deny --locked --manifest-path vendor/xattr/Cargo.toml --config vendor/xattr/deny.toml check
