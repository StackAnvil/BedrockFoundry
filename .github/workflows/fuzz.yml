name: Fuzz
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/lib.rs
      - src/archive.rs
      - src/storage.rs
      - src/server.rs
      - src/marketplace.rs
      - src/marketplace/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/lib.rs
      - src/archive.rs
      - src/storage.rs
      - src/server.rs
      - src/marketplace.rs
      - src/marketplace/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FUZZ_TOOLCHAIN: nightly-2026-11-01
jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - zip_admission
          - zip_entries
          - bundle_extract
          - distribution_extract
          - receipt
          - download_metadata
    env:
      TARGET: ${{ matrix.target }}
      # Pull requests and pushes run a short check. The weekly run fuzzes longer.
      SECONDS_PER_TARGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fuzzing toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build fuzz target
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build "$TARGET"
      - name: Fuzz
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10
      - name: Save corpus
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
