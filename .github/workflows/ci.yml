name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to check for a release.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Formatting and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Format vendored xattr
        run: cargo fmt --manifest-path vendor/xattr/Cargo.toml --check
      - name: Lint Python
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.16.0'
          args: check
      - name: Check Python formatting
        run: ruff format --check
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Test release packaging
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate release notes
        run: python tools/release.py notes > /dev/null
  test:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            check: linux
          - os: windows-latest
            platform: Windows
            check: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test desktop and core
        run: cargo test --locked --all-targets
      - name: Check CLI without desktop dependencies
        run: cargo check --locked --no-default-features
      - name: Build desktop executable
        run: cargo build --locked
      - name: Verify executable version
        shell: bash
        run: ./target/debug/bedrock-foundry --version
