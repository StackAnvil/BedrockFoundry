name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, such as v0.1.0.
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check tag, package version, and main branch ancestry
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python tools/release.py metadata --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          revision=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$revision"
          git merge-base --is-ancestor "$revision" origin/main
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          python tools/release.py notes > /dev/null
  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.revision }}
  build:
    name: Package (${{ matrix.platform }})
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: bedrock-foundry
          - os: windows-latest
            platform: windows-x86_64
            executable: bedrock-foundry.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Build release executable
        run: cargo build --locked --release
      - name: Install license report tool
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Collect dependency license texts
        shell: bash
        run: cargo about generate --locked --fail tools/licenses.hbs --output-file third-party-licenses.html
      - name: Package executable, licenses, and user guides
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          version_output=$("./target/release/$EXECUTABLE" --version)
          test "$version_output" = "bedrock-foundry $RELEASE_VERSION"
          python tools/release.py package --platform "$RELEASE_PLATFORM" --binary "target/release/$EXECUTABLE" --licenses third-party-licenses.html --commit "$REVISION" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Verify complete release archives and checksums
        run: |
          python tools/release.py checksums --directory dist
          python tools/release.py notes > release-notes.md
      - name: Publish all assets together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true || { echo 'This release is already published.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$PRERELEASE" --title "Bedrock Foundry $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
          gh release view "$RELEASE_TAG" --json url --jq '.url'
