name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            executable: bedrock-foundry
          - os: windows-latest
            name: windows-x86_64
            executable: bedrock-foundry.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
      - name: Install Rust
        run: rustup show
      - name: Build
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-foundry-${{ matrix.name }}
          path: |
            target/release/${{ matrix.executable }}
            LICENSE
            THIRD_PARTY_NOTICES.md
            vendor/xattr/LICENSE-MIT
            vendor/xattr/LICENSE-APACHE
          if-no-files-found: error
