[package]
name = "bedrock-foundry"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Set up Bedrock servers with your Marketplace add-ons."
repository = "https://github.com/StackAnvil/BedrockFoundry"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:open"]

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
bedrock-services = { git = "https://github.com/cinnabar-mc/bedrock-services", rev = "cf4bfc5f59eaade09b0d075463e5f77b7d8c2e63" }
cfb8 = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
open = { version = "5", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }


[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"

# GPUI 0.2.2's tar dependency uses xattr 0.2.3. Preserve its API while fixing
# the Linux ENOATTR alias removed by current libc releases.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[lints.clippy]
nursery = { level = "warn", priority = -1 }
# Noisy nursery lints.
missing_const_for_fn = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow" # Conflicts with unreachable_pub.
suboptimal_flops = "allow"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
redundant_clone = "warn"

# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
significant_drop_tightening = "warn"

# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"

# Public library items are internal APIs shared by the CLI and desktop.
missing_errors_doc = "allow"
# Keep RGB and RGBA literals in the same form as hex color codes.
unreadable_literal = "allow"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
panic_in_result_fn = "warn"
unreachable = "warn"
clone_on_ref_ptr = "warn"
wildcard_enum_match_arm = "warn"
format_push_string = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"

[lints.rust]
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
unit_bindings = "warn"
unsafe_code = "forbid"
