[package]
name = "bedrock-foundry-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keep the fuzz crate out of the main project's builds, Clippy, and cargo-deny.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
bedrock-foundry = { path = "..", default-features = false }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
time = "0.3"
uuid = "1"
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "zip_admission"
path = "fuzz_targets/zip_admission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_entries"
path = "fuzz_targets/zip_entries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_extract"
path = "fuzz_targets/bundle_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "distribution_extract"
path = "fuzz_targets/distribution_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt"
path = "fuzz_targets/receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "download_metadata"
path = "fuzz_targets/download_metadata.rs"
test = false
doc = false
bench = false
